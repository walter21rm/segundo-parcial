services:
  postgres-catalogo:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo_dev
      POSTGRES_DB: catalogo
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - catalogo-data:/var/lib/postgresql/data

  postgres-pedidos:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos_dev
      POSTGRES_DB: pedidos
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pedidos-data:/var/lib/postgresql/data

  catalogo:
    build: ./servicios/catalogo
    environment:
      PORT: "8091"
      SEED: "true"
      DATABASE_URL: postgres://catalogo:catalogo_dev@postgres-catalogo:5432/catalogo?sslmode=disable
    ports:
      - "8091:8091"
    depends_on:
      postgres-catalogo:
        condition: service_healthy

  pedidos:
    build: ./servicios/pedidos
    environment:
      PORT: "8092"
      SEED: "true"
      CATALOGO_URL: http://catalogo:8091
      CATALOGO_TIMEOUT_SEGUNDOS: "3"
      DATABASE_URL: postgres://pedidos:pedidos_dev@postgres-pedidos:5432/pedidos?sslmode=disable
    ports:
      - "8092:8092"
    depends_on:
      postgres-pedidos:
        condition: service_healthy
      catalogo:
        condition: service_started

  web:
    build: ./web
    environment:
      PORT: "3847"
      CATALOGO_URL: http://catalogo:8091
      PEDIDOS_URL: http://pedidos:8092
    ports:
      - "3847:3847"
    depends_on:
      - catalogo
      - pedidos

volumes:
  catalogo-data:
  pedidos-data:
