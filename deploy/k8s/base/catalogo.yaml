apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo
  namespace: feria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo
  template:
    metadata:
      labels:
        app: catalogo
    spec:
      containers:
        - name: catalogo
          image: feria/catalogo:1.0.0
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: PORT
              value: "8091"
            - name: SEED
              value: "true"
            - name: VERSION
              value: "1.0.0"
            - name: PGHOST
              value: postgres-catalogo
            - name: PGUSER
              value: catalogo
            - name: PGDATABASE
              value: catalogo
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: feria-db
                  key: catalogo-password
          readinessProbe:
            httpGet:
              path: /listo
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /salud
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalogo
  namespace: feria
spec:
  selector:
    app: catalogo
  ports:
    - name: http
      port: 8091
      targetPort: http
