apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: feria
resources:
  - namespace.yaml
  - postgres.yaml
  - catalogo.yaml
  - pedidos.yaml
  - web.yaml
secretGenerator:
  - name: feria-db
    literals:
      - catalogo-password=cambiar-en-aws
      - pedidos-password=cambiar-en-aws
generatorOptions:
  disableNameSuffixHash: true
