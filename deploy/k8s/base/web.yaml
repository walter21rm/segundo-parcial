apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: feria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: feria/web:1.0.0
          ports:
            - name: http
              containerPort: 3847
          env:
            - name: PORT
              value: "3847"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: CATALOGO_URL
              value: http://catalogo:8091
            - name: PEDIDOS_URL
              value: http://pedidos:8092
          readinessProbe:
            httpGet:
              path: /api/salud
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/salud
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: feria
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
